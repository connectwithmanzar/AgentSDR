name: Publish recruiter-desk image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Patch Dockerfile to include the self-contained migrator
        run: |
          test -s scripts/migrate-career-one-stop-recruiter-desk-standalone.ts
          python3 -c '
          from pathlib import Path
          p = Path("Dockerfile")
          text = p.read_text()
          needle = "USER nextjs"
          insert = "# Recruiter-desk migrator (self-contained; no drizzle graph)\nCOPY --from=builder --chown=nextjs:nodejs /app/scripts/migrate-career-one-stop-recruiter-desk-standalone.ts ./scripts/migrate-career-one-stop-recruiter-desk.ts\n"
          if needle not in text:
              raise SystemExit("Dockerfile missing USER nextjs")
          if "migrate-career-one-stop-recruiter-desk.ts" not in text:
              p.write_text(text.replace(needle, insert + "\n" + needle, 1))
          print("Dockerfile patched")
          '

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/connectwithmanzar/agentsdr:recruiter-desk
            ghcr.io/connectwithmanzar/agentsdr:recruiter-desk-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/connectwithmanzar/AgentSDR
            org.opencontainers.image.title=AgentSDR
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the GHCR package public if it is private
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method POST /user/packages/container/agentsdr/visibility -f visibility=public
          gh api --method POST /users/connectwithmanzar/packages/container/agentsdr/visibility -f visibility=public
          exit 0
